# Render Blueprint: the PaySettle web server (Docker) and its Postgres database, as the hosted demo runs.
# Deploy: Render dashboard → New → Blueprint → this repository. Render asks for the values marked `sync: false`.
#
# After the first deploy, create the schema and the demo data once, from a machine with this repository checked out,
# with DATABASE_URL set to the database's external URL (add your IP to the database's access list first):
#   npm ci && npm run db:push && npm run db:guards && npm run db:seed
# Seed with PAYPAL_CLIENT_ID empty so the demo contracts use the mock rail; the running app uses the Sandbox.
#
# Timers (hold-expiry watchdog, review reminders) run when /api/cron/tick is called with the header
# x-cron-secret = CRON_SECRET. Add a Render cron job or any scheduler that calls it every few minutes.
services:
  - type: web
    name: paysettle
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paysettle-db
          property: connectionString
      - key: PAYSETTLE_ENV
        value: sandbox
      - key: APP_URL
        sync: false # the service's own https address, e.g. https://paysettle.onrender.com
      - key: SIGNING_KEY
        generateValue: true
      - key: COMPLIANCE_SIGNING_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # PayPal Sandbox (optional: without a client id the app uses the mock rail)
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_RAIL
        value: A1
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false # webhook URL: <APP_URL>/api/webhooks/paypal
      - key: PAYPAL_PROVIDER1_EMAIL
        sync: false
      - key: PAYPAL_PROVIDER2_EMAIL
        sync: false
      - key: PAYPAL_PLATFORM_EMAIL
        sync: false
      - key: PAYPAL_BUYER_EMAIL
        sync: false
      # AI gateway (optional: without a key the AI panels say "AI unavailable" and the rule checks still run)
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.anthropic.com
      - key: AI_PROTOCOL
        value: anthropic
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: AI_DAILY_TOKEN_CAP
        value: "200000"
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_MAX_TOKENS
        value: "2000"
      - key: AI_PRICE_IN_PER_MTOK
        value: "3"
      - key: AI_PRICE_OUT_PER_MTOK
        value: "15"
      - key: OIDC_ROLE_CLAIM
        value: groups
      - key: OIDC_ROLE_MAP
        value: '{"ps-ops":"ops","ps-mediator":"mediator","ps-finance":"finance","ps-admin":"admin"}'

databases:
  - name: paysettle-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: [] # closed to the internet; the web service reaches it over Render's private network
