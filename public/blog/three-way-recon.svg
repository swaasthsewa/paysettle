<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="t d">
  <title id="t">Three-way reconciliation</title>
  <desc id="d">Plane A, the signed contract, is checked against plane B, the ledger; plane B is checked against plane C, PayPal's records.</desc>
  <rect width="880" height="340" rx="22" fill="#ffffff"/>
  <g font-family="Outfit, Segoe UI, system-ui, sans-serif" fill="#111418">
    <g>
      <rect x="32" y="40" width="240" height="252" rx="16" fill="#e0f2f0"/>
      <text x="52" y="74" font-size="18" font-weight="600" fill="#0f766e">A · Contract</text>
      <text x="52" y="96" font-size="13" fill="#4e545c">signed revision, this tranche</text>
      <g font-size="14"><text x="52" y="132">M02  Clickable design   15%</text><text x="52" y="158">M03  API on staging      20%</text><text x="52" y="184">M04  Core features       25%</text><text x="52" y="210">…</text></g>
      <text x="52" y="262" font-size="14" font-weight="600">should be held: contract total</text>
    </g>
    <g>
      <rect x="320" y="40" width="240" height="252" rx="16" fill="#f7f7fb" stroke="#dedee8"/>
      <text x="340" y="74" font-size="18" font-weight="600">B · Ledger</text>
      <text x="340" y="96" font-size="13" fill="#4e545c">double-entry, append-only</text>
      <g font-size="14"><text x="340" y="132">HOLD</text><text x="340" y="158">RELEASE</text><text x="340" y="184">FEE</text><text x="340" y="210">REFUND · VOID</text></g>
      <text x="340" y="250" font-size="13" font-weight="600">held = released + fees</text>
      <text x="340" y="270" font-size="13" font-weight="600">+ returned + still held</text>
    </g>
    <g>
      <rect x="608" y="40" width="240" height="252" rx="16" fill="#fdf1dc"/>
      <text x="628" y="74" font-size="18" font-weight="600" fill="#8a5c05">C · PayPal</text>
      <text x="628" y="96" font-size="13" fill="#4e545c">transaction records</text>
      <g font-size="14"><text x="628" y="132">AUTHORIZATION</text><text x="628" y="158">CAPTURE</text><text x="628" y="184">REFUND</text><text x="628" y="210">VOID</text></g>
      <text x="628" y="262" font-size="14" font-weight="600">grouped by PayPal reference</text>
    </g>
    <g stroke="#111418" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M276 166 H316"/><path d="M286 158 L276 166 L286 174"/><path d="M306 158 L316 166 L306 174"/>
      <path d="M564 166 H604"/><path d="M574 158 L564 166 L574 174"/><path d="M594 158 L604 166 L594 174"/>
    </g>
    <g font-size="13" fill="#4e545c" text-anchor="middle"><text x="296" y="318">A ↔ B</text><text x="584" y="318">B ↔ C</text></g>
  </g>
</svg>
